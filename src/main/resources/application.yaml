server:
  port: 8081

spring:
  application:
    name: carsales
  datasource:
    url: jdbc:mysql://localhost:3306/cars?rewriteBatchedStatements=true&useServerPrepStmts=false
    username: root
    password:
    hikari:
      connection-timeout: 60000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 5MB